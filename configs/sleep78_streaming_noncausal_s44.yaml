# Seed 44 replicate of the end-to-end causal pilot (noncausal arm).
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed78_streaming"
  target_channel: "EEG Fpz-Cz"
  resample_rate: 100
  wake_trim_minutes: 30
  normalization:
    method: "causal_rolling"
    window_seconds: 30
    eps: 0.00000001
  sequence_length: 120
  sequence_stride: 60
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  seed: 44

model:
  mrcnn_channels_1: 16
  mrcnn_channels_2: 16
  tcn_channels: [32, 32, 32]
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4]
  tcn_dropout: 0.2
  attn_num_heads: 4
  attn_dropout: 0.1
  num_classes: 5
  causal: false

train:
  epochs: 40
  early_stopping_patience: 8
  checkpoint_metric: "kappa"
  log_dir: "logs_78streaming_noncausal_s44"
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  loss_type: "focal"
  focal_gamma: 2.0
  use_weighted_sampler: false
  num_folds: 5
  checkpoint_dir: "checkpoints_78streaming_noncausal_s44"
  seed: 44
  # Subject partition for cross-validation. Held at 42 across every seed variant so
  # that `seed` changes initialisation only. See REPRODUCIBILITY.md section 5.
  split_seed: 42
