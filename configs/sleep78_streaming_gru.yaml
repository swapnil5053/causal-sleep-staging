# Alternative causal architecture: multi-resolution CNN plus unidirectional GRU.
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed78_streaming"
  target_channel: "EEG Fpz-Cz"
  resample_rate: 100
  wake_trim_minutes: 30
  normalization:
    method: "causal_rolling"
    window_seconds: 30
    eps: 0.00000001
  sequence_length: 120
  sequence_stride: 60
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  seed: 42

model:
  architecture: "gru"
  mrcnn_channels_1: 16
  mrcnn_channels_2: 16
  gru_hidden_size: 32
  gru_num_layers: 2
  gru_dropout: 0.1
  num_classes: 5
  causal: true

train:
  epochs: 40
  early_stopping_patience: 8
  checkpoint_metric: "kappa"
  log_dir: "logs_78streaming_gru_s42"
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  loss_type: "focal"
  focal_gamma: 2.0
  use_weighted_sampler: false
  num_folds: 5
  checkpoint_dir: "checkpoints_78streaming_gru_s42"
  seed: 42