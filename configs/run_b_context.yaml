# Run B: Run A plus a longer causal context window (120s instead of 60s).
# Temporal context is the project's central hypothesis and latency headroom is 66x.
# Configuration for Continuous Sleep Staging from Raw EEG

# Data pipeline parameters
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  target_channel: "EEG Fpz-Cz"
  resample_rate: 100       # Target sampling rate in Hz
  wake_trim_minutes: 30    # keep 30 min of wake either side of sleep, drop the rest
                           # (standard protocol; without it Wake is ~68% of the data)
  sequence_length: 120      # context length in seconds (was 30; longer context helps)
  sequence_stride: 60      # sliding window stride
  train_ratio: 0.6         # Split ratios if not doing cross-validation
  val_ratio: 0.2
  test_ratio: 0.2
  seed: 42

# Model architecture parameters
model:
  # Multi-Resolution CNN Branch Channels
  mrcnn_channels_1: 16     # Channels for high-frequency branch (kernel=50)
  mrcnn_channels_2: 16     # Channels for low-frequency branch (kernel=400)
  
  # Temporal Convolutional Network (TCN) stack
  tcn_channels: [32, 32, 32] # Channel sizes for sequential temporal blocks
  tcn_kernel_size: 3
  tcn_dilations: [1, 2, 4]   # Exponential dilation rates
  tcn_dropout: 0.2
  
  # Causal Multi-Head Self-Attention
  attn_num_heads: 4
  attn_dropout: 0.1
  
  # Output classes (W, N1, N2, N3, REM)
  num_classes: 5

  # Causality switch. true = the real model. false keeps the architecture and
  # parameter count identical but allows access to future signal (ablation only).
  causal: true

# Training loop parameters
train:
  epochs: 40              # cap only; early stopping ends the run when validation kappa plateaus
  early_stopping_patience: 8   # stop if the checkpoint metric has not improved in 8 epochs
  checkpoint_metric: "kappa"   # "kappa" or "macro_f1". Kappa is the reported headline.
  log_dir: "logs_runB"         # per-run output dir, override so runs do not overwrite each other
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001   # note: plain 1e-4 is parsed by yaml as a string, not a float
  loss_type: "focal"       # Options: "focal", "weighted_ce"
  focal_gamma: 2.0
  use_weighted_sampler: false # focal loss alpha already handles imbalance; stacking both
                              # made the model spam N1 (precision 0.12-0.20)
  num_folds: 5             # Folds for subject-wise cross-validation
  checkpoint_dir: "checkpoints_runB"
  seed: 42
